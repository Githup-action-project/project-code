        runs-on: ubuntu-latest
        steps:
            - name: Simple JS Action
              uses: actions//hello-world-javascript-action@1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b
              with:
                who-to-greet: Mohammed

      # Use the output from the `hello` step
